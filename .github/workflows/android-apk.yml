name: Build Notify Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notify-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create android-latest android/app/build/outputs/apk/debug/app-debug.apk --prerelease --title "Notify Android — Latest build" --notes "Latest automatically built Notify Android APK for testing."
          fi
